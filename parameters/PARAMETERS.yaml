    owner: Martin
  - id: P-AF-090
    name: Vertical speed tracking tolerance
    description: Largest settled difference between vertical speed and selected vertical speed in Vertical speed mode, or in Go to altitude at a selected vertical speed.
    unit: m/s
    value: null
    tolerance: null
    status: TBD
    source: CONOPS SC-020, SC-040, SC-050
    owner: Martin
  - id: P-AF-100
    name: Altitude capture maximum overshoot
    description: Largest overshoot of the selected altitude when Altitude hold captures it from Go to altitude or Vertical speed.
    unit: m
    value: null
    tolerance: null
    status: TBD
    source: CONOPS SC-020
    owner: Martin
  - id: P-AF-110
    name: Altitude hold tolerance
    description: Largest altitude error while Altitude hold or Hover holds an altitude.
    unit: m
    value: null
    tolerance: null
    note: 'In Hover with the landing gear extended (before Land descends, after Takeoff reaches the hover height), the altitude error must stay below P-AF-210 - P-DYN-040 (0.124 m), or the gear touches the ground (C5, B3).'
    status: TBD
    source: CONOPS SC-020 to SC-120
    owner: Martin
  - id: P-AF-120
    name: Horizontal speed tracking tolerance
    description: Largest settled difference between horizontal speed and selected horizontal speed in Heading (there is no separate speed mode, D56).
    unit: m/s
    value: null
    tolerance: null
    status: TBD
    source: CONOPS SC-040, SC-050, SC-060
    owner: Martin
  - id: P-AF-130
    name: Heading tolerance
    description: Largest settled difference between heading and the selected or held heading.
    unit: rad
    value: null
    tolerance: null
    status: TBD
