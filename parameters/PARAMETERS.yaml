    source: L1-AER-460; FUNCTIONAL_ANALYSIS §7.4; B1 proposal
    owner: Martin
  - id: P-AF-170
    name: Hover horizontal speed tolerance
    description: Largest horizontal speed once Go to hover or Hover has stopped the vehicle.
    unit: m/s
    value: null
    tolerance: null
    note: 'At most P-SYS-510, so that a Land from Hover meets the landing envelope (L1-AER-970).'
    status: TBD
    source: CONOPS SC-100
    owner: Martin
  - id: P-AF-180
    name: Level attitude tolerance
    description: Largest pitch or roll angle magnitude; pitch and roll are held at zero at all times (D10, D57).
    unit: rad
    value: null
    tolerance: null
    status: TBR
    source: CONOPS §4.4, Q2
    owner: Martin
  - id: P-AF-190
    name: Settling time
    description: Longest time from a capture onset or target change until the controlled quantity is within its tolerance.
    unit: s
    value: null
    tolerance: null
    status: TBD
    source: CONOPS §5
    owner: Martin
  - id: P-AF-200
    name: Autoflight manoeuvre acceleration limit
    description: Largest vehicle acceleration magnitude that autoflight guidance commands (D16 g-limited manoeuvres). Share of P-SYS-440.
    unit: m/s^2
    value: 9.80665
    tolerance: null
    note: '1.0 g'
    status: TBR
    source: L1-AER-300; D16; FUNCTIONAL_ANALYSIS §7.2
    owner: Martin
  - id: P-AF-210
    name: Hover height above the ground
    description: Height above the ground (CV-400) of the lowest point of the body that Go to hover brings the vehicle to, from above or from below (D70), that Hover holds and that Takeoff climbs to (D69). A project constant, not a crew selection (D56). At level attitude the CG altitude is P-AF-210 + P-DYN-030/2.
    unit: m
    value: 1.524
    tolerance: null
    note: '5 ft (owner, D70). TT-820 closed by CV-400 (CR-B3-36).'
    status: Set
    source: D56, D70
    owner: Martin
  - id: P-AF-220
    name: Standard vertical speed
    description: Vertical speed magnitude that Go to altitude uses until the crew selects another vertical speed (D56). At most P-SYS-240 in a climb and P-SYS-250 in a descent.
    unit: m/s
    value: 10.16
    tolerance: null
    note: '2000 ft/min, climb and descent; also the default of Vertical speed mode (D70).'
    status: Set
    source: D56, D70
    owner: Martin
  - id: P-AF-230
    name: Vertical acceleration for vertical speed changes
    description: Magnitude of the vertical acceleration with which autoflight changes the vertical speed toward a new target (engagement of Go to altitude or Vertical speed, a new selection, a level-off), so the vertical speed ramps rather than steps (D70).
    unit: m/s^2
    value: 0.980665
    tolerance: null
    note: '0.1 g: 10.4 s to reach P-AF-220 and a level-off over 52.6 m (173 ft).'
    status: TBR
    source: owner (D70)
    owner: Martin
  - id: P-AF-240
    name: Takeoff and landing vertical speed
    description: Vertical speed magnitude of the Takeoff climb to the hover height and of the Land descent to touchdown (D69).
    unit: m/s
    value: 0.3048
    tolerance: null
    note: '60 ft/min, well inside the landing envelope P-SYS-500.'
    status: TBR
    source: owner (D69, D70); L1-AER-960, -970
    owner: Martin

