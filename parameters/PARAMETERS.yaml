    value: null
    tolerance: null
    status: TBD
    source: CONOPS §4.3, §5, N-070
    owner: Martin
  - id: P-AF-040
    name: Heading selection resolution
    description: Smallest step of the selected heading.
    note: Owned by the flight control panel (FCP, D55), which takes the crew selections; the ID keeps its AF prefix because CONOPS and the TBD register cite it.
    unit: deg
    crew_facing: true
    value: null
    tolerance: null
    status: TBD
    source: CONOPS §4.3, §5, N-070
    owner: Martin
  - id: P-AF-060
    name: Annunciation latency
    description: 'AF share of the aircraft-level annunciation latency P-SYS-470: at most P-SYS-470 minus P-TM-010.'
    unit: s
    value: null
    tolerance: null
    status: TBD
    source: L1-AER-470; FUNCTIONAL_ANALYSIS §7.5; CONOPS §4.4, N-060
    owner: Martin
  - id: P-AF-090
    name: Vertical speed tracking tolerance
    description: Largest settled difference between vertical speed and selected vertical speed in Vertical speed mode, or in Go to altitude at a selected vertical speed.
    unit: m/s
    value: null
    tolerance: null
    status: TBD
    source: CONOPS SC-020, SC-040, SC-050
    owner: Martin
  - id: P-AF-100
    name: Altitude capture maximum overshoot
    description: Largest overshoot of the selected altitude when Altitude hold captures it from Go to altitude or Vertical speed.
    unit: m
    value: null
    tolerance: null
    status: TBD
    source: CONOPS SC-020
    owner: Martin
  - id: P-AF-110
    name: Altitude hold tolerance
    description: Largest altitude error while Altitude hold or Hover holds an altitude.
    unit: m
    value: null
    tolerance: null
    status: TBD
    source: CONOPS SC-020 to SC-120
    owner: Martin
  - id: P-AF-120
    name: Horizontal speed tracking tolerance
    description: Largest settled difference between horizontal speed and selected horizontal speed in Heading (there is no separate speed mode, D56).
    unit: m/s
    value: null
    tolerance: null
    status: TBD
    source: CONOPS SC-040, SC-050, SC-060
    owner: Martin
  - id: P-AF-130
    name: Heading tolerance
    description: Largest settled difference between heading and the selected or held heading.
    unit: rad
    value: null
    tolerance: null
    status: TBD
    source: CONOPS SC-060, SC-090
    owner: Martin
  - id: P-AF-140
    name: Track tolerance in Heading
    description: Largest difference between the track and the selected heading once Heading has settled at a non-zero horizontal speed.
    unit: rad
    value: null
    tolerance: null
    status: TBD
    source: CONOPS SC-060
    owner: Martin
  - id: P-AF-160
    name: Autoflight position-holding share
    description: AF guidance share of the position-holding budget P-SYS-450 (reference position versus target), for Stationary and Hover.
    unit: m
    value: 0.5
    tolerance: null
    status: TBR
    source: L1-AER-460; FUNCTIONAL_ANALYSIS §7.4; B1 proposal
    owner: Martin
  - id: P-AF-170
    name: Hover horizontal speed tolerance
    description: Largest horizontal speed once Go to hover or Hover has stopped the vehicle.
    unit: m/s
    value: null
    tolerance: null
    status: TBD
    source: CONOPS SC-100
    owner: Martin
  - id: P-AF-180
    name: Level attitude tolerance
    description: Largest pitch or roll angle magnitude; pitch and roll are held at zero at all times (D10, D57).
    unit: rad
    value: null
    tolerance: null
    status: TBR
    source: CONOPS §4.4, Q2
    owner: Martin
  - id: P-AF-190
    name: Settling time
    description: Longest time from a capture onset or target change until the controlled quantity is within its tolerance.
    unit: s
    value: null
    tolerance: null
    status: TBD
    source: CONOPS §5
    owner: Martin
  - id: P-AF-200
    name: Autoflight manoeuvre acceleration limit
    description: Largest vehicle acceleration magnitude that autoflight guidance commands (D16 g-limited manoeuvres). Share of P-SYS-440.
    unit: m/s^2
    value: 9.80665
    tolerance: null
    note: 1.0 g
    status: TBR
    source: L1-AER-300; D16; FUNCTIONAL_ANALYSIS §7.2
    owner: Martin
  - id: P-AF-210
    name: Hover height above the ground
    description: Height above the ground that Go to hover brings the vehicle to and that Hover holds. A project constant, not a crew selection (D56). The ground is flat at altitude zero (D8), so it is also an altitude.
    unit: m
    value: null
    tolerance: null
    status: TBD
    source: D56; CONOPS SC-100
    owner: Martin
  - id: P-AF-220
    name: Standard vertical speed
    description: Vertical speed magnitude that Go to altitude uses until the crew selects another vertical speed (D56). At most P-SYS-240 in a climb and P-SYS-250 in a descent.
    unit: m/s
    value: null
    tolerance: null
    status: TBD
    source: D56; CONOPS SC-020
    owner: Martin

